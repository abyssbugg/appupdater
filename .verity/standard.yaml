version: 1.0.0
created_by: verity-cli
knowledge_spec:
  project_name: appupdater
  languages: [swift]
  frameworks: [sparkle, swiftui, appkit, cryptoKit]
  architecture: monolith
  build_system: swift-pm
  test_framework: swift-testing
quality_dimensions:
  - id: comprehensibility
    description: Code readable in one context load
    signals:
      - metric: file_length
        threshold: 300
        unit: lines
        rationale: AI context windows degrade on large files
      - metric: cyclomatic_complexity
        threshold: 15
        unit: per_function
        rationale: Complexity-aware feedback improves AI performance by 35.71%
      - metric: function_length
        threshold: 50
        unit: lines
        rationale: Short functions are easier for agents to modify safely
      - metric: naming_quality
        tool: ai
        rationale: Descriptive names improve AI comprehension by 2x
  - id: modularity
    description: Modify one concern without touching 3+ files
    signals:
      - metric: single_responsibility
        tool: ai
        rationale: AI performance drops sharply at 3+ files per change
      - metric: shallow_abstractions
        tool: ai
        rationale: LLMs struggle with deep inheritance hierarchies
  - id: type_safety
    description: Type system catches errors before runtime
    signals: []
  - id: test_adequacy
    description: Tests define expected behavior for agents
    signals:
      - metric: test_coverage
        threshold: 80
        unit: percent
        ai_threshold: 90
        rationale: 90% recommended for AI-generated code
      - metric: test_quality
        tool: ai
        rationale: Tests are the primary safety net for AI agents
security_patterns:
  - id: no-hardcoded-secrets
    description: No secrets, API keys, passwords, or tokens in source code
    severity: critical
    cwe:
      - CWE-798
    enforced_by: []
  - id: input-sanitization
    description: All user input validated and sanitized before use
    severity: critical
    cwe:
      - CWE-20
      - CWE-80
      - CWE-89
      - CWE-117
    enforced_by: []
  - id: parameterized-queries
    description: Database queries use parameters, never string concatenation
    severity: critical
    cwe:
      - CWE-89
    enforced_by: []
  - id: dependency-verification
    description: No known-vulnerable dependencies
    severity: high
    cwe:
      - CWE-1395
    enforced_by: []
  - id: no-unsafe-deserialization
    description: No unsafe deserialization of untrusted data
    severity: high
    cwe:
      - CWE-502
    enforced_by: []
  - id: access-control-checks
    description: Authorization verified on all sensitive operations
    severity: high
    cwe:
      - CWE-639
    enforced_by: []
  - id: config-file-integrity
    description: Configuration files not manipulable by untrusted input
    severity: high
    cwe:
      - CWE-15
    enforced_by: []
custom_patterns:
  - id: honest-verdicts
    description: >-
      Update checks produce only the honest verdict set (update / current /
      unknown / failed); a fabricated success or invented version claim is a
      violation. "unknown" is a valid, expected outcome for unverifiable apps.
    severity: critical
    rationale: >-
      Product integrity contract (AGENTS.md honest boundary): the app's entire
      value is truthful newest-version data. Phase-2 gate: "0 false update
      claims on a real scan".
  - id: no-auto-apply
    description: >-
      The app never auto-applies installs. Auto rules govern checks and
      notifications only; "Install Now" stages the exact owner-run CLI command,
      and install --apply stays a per-app owner action.
    severity: critical
    rationale: >-
      LOCKED consent boundary (AGENTS.md decisions; BUILD-PLAN Phase 3/4):
      destructive installs require the owner's explicit hand.
  - id: swift-testing-only
    description: >-
      All tests use Swift Testing (@Test, #expect, #require); no new XCTest
      cases or suites. A run collecting zero tests must be treated as failure,
      never green.
    severity: high
    rationale: >-
      XCTest discovery is broken on the locked toolchain (Xcode 27-beta /
      Swift 6.4 — AGENTS.md gotcha ledger); silent 0-test green runs are a
      known trap.
  - id: per-process-test-roots
    description: >-
      Test suites that wipe temp fixture roots must name them uniquely per
      PROCESS (static let with UUID().uuidString); fixed shared names are a
      violation.
    severity: high
    rationale: >-
      The Phase-4 cross-process fixture collision: concurrent swift test
      runners deleted each other's fixtures mid-flight (AGENTS.md gotcha
      ledger, root-caused and concurrency-proven).
  - id: no-force-unwrap-in-sources
    description: >-
      Shipping code under Sources/ must not force-unwrap optionals (!);
      root-cause handling (#require in tests, guarded unwrap in sources)
      instead. Test files are exempt where fail-fast is the purpose.
    severity: high
    rationale: >-
      .swiftlint.yml policy (force_unwrapping = error in shipping code) —
      15 baseline sites were all root-cause fixed; keep the tree clean.
custom_patterns_version_note: proposed-by-coordinator 2026-10-26, owner-approved (adopt all)
process_constraints:
  self_healing_limit: 2
  analysis_mode: balanced
  compound_enabled: true
  memory_graph_enabled: true
  memory_graph_budget_tokens: 2000
  knowledge_injection_budget_tokens: 2000
  finding_autosuppress_threshold: 2
  intent_fail_threshold: 4
  intent_warn_threshold: 7
  exclude_paths:
    - node_modules
    - dist
    - build
    - .git
    - vendor
    - __pycache__
    - .next
    - coverage
tool_configuration: {}
