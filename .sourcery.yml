# Sourcery (2.3.0) configuration — AppUpdater
# v1 posture (recorded honestly): SOURCING ONLY — Sourcery parses the codebase
# so its scanning/analysis is proven wired, but there are NO templates yet:
# every conformance in this codebase is hand-written or compiler-synthesized,
# and codegen without a repetition to remove is decoration, not setup
# (Scripts/SourceryTemplates/README.md). Add a .stencil template here only
# when real boilerplate duplication appears.
sources:
  - Sources
templates:
  - Scripts/SourceryTemplates
# Mandatory key even with zero templates; parked in the gitignored build tree
# until a real template lands (generated code would then move to Sources/Generated
# as a deliberate, reviewed change).
output:
  .build/sourcery
